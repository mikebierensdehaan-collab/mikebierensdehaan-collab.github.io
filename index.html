let _cache = {};
let _loaded = false;
let _syncStatus = 'loading';
const _listeners = [];
function onSyncStatus(fn) { _listeners.push(fn); }
function _notify(s) { _syncStatus = s; _listeners.forEach(fn => fn(s)); }
async function syncLoad() {
  try { const l = localStorage.getItem('ams_cache'); if (l) _cache = JSON.parse(l); } catch(_) {}
  _loaded = true;
  _notify('loading');
  try {
    const res = await fetch(SCRIPT_URL + '?action=getAll', {method:'GET', mode:'cors'});
    const data = await res.json();
    _cache = Object.assign({}, _cache, data);
    try { localStorage.setItem('ams_cache', JSON.stringify(_cache)); } catch(_) {}
    _notify('ok');
  } catch(e) { _notify('offline'); }
}
function syncGet(key) { return _cache[key] || ''; }
function syncSet(key, value) {
  _cache[key] = value;
  try { localStorage.setItem('ams_cache', JSON.stringify(_cache)); } catch(_) {}
  const body = new URLSearchParams({action:'set', key, value});
  fetch(SCRIPT_URL, {method:'POST', mode:'no-cors', body})
    .then(()=>_notify('ok')).catch(()=>_notify('offline'));
}

function typeCol(day) {
  if (day.type === "GYM") return "#1D4ED8";
  const l = day.label;
  if (l.includes("AMSTERDAM") || l.includes("Long")) return "#854D0E";
  if (l.includes("Threshold")) return "#C2410C";
  if (l.includes("Speed") || l.includes("Hill")) return "#B45309";
  if (l.includes("TIME TRIAL") || l.includes("Sharpener")) return "#047857";
  if (l.includes("Altitude")) return "#0F766E";
  return "#15803D";
}

// ── WEIGHT RECOMMENDATION ENGINE ─────────────────────────────────────────────
// For a given exercise in a given week, find the most recent logged weight
// and apply the progression instruction to suggest the next weight.

function findLastLogged(exName, currentWeek, currentGymKey) {
  // Search backwards through all weeks for the same exercise name
  for (let wk = currentWeek - 1; wk >= 1; wk--) {
    const w = WEEKS.find(x => x.week === wk);
    if (!w || !w.gym) continue;
    for (const gk of ['dayA','dayB','dayC']) {
      const gd = w.gym[gk];
      if (!gd || !gd.exercises) continue;
      const idx = gd.exercises.findIndex(e => e.name === exName);
      if (idx === -1) continue;
      const sk = 'ams_' + wk + '_' + gk + '_' + idx;
      const logged = syncGet(sk + '_kg');
      if (logged && logged.trim() !== '') {
        const kg = parseFloat(logged.replace(/[^0-9.]/g,''));
        if (!isNaN(kg)) return { kg, week: wk, load: gd.exercises[idx].load };
      }
    }
  }
  return null;
}

function calcRecommended(targetLoad, exName, currentWeek, currentGymKey) {
  if (!targetLoad) return null;
  const tl = targetLoad.trim().toLowerCase();

  // If it says BW or bodyweight — no recommendation needed
  if (tl === 'bw' || tl.includes('bodyweight') || tl.includes('body weight')) return null;

  const last = findLastLogged(exName, currentWeek, currentGymKey);

  // Parse the instruction
  const pctMatch  = tl.match(/^([+-])(\d+)%/);
  const kgMatch   = tl.match(/^([+-])(\d+(?:\.\d+)?)\s*kg/);
  const matchWeek = tl.match(/match w(\d+)/);
  const deload    = tl.match(/(-\d+)%/);
  const absolute  = tl.match(/^(\d+(?:\.\d+)?)\s*%\s*(\d+rm)/i);

  if (pctMatch && last) {
    const sign = pctMatch[1] === '+' ? 1 : -1;
    const pct  = parseFloat(pctMatch[2]) / 100;
    const rec  = Math.round((last.kg * (1 + sign * pct)) * 2) / 2; // round to nearest 0.5kg
    return { rec, basis: last.kg, week: last.week, instruction: targetLoad };
  }

  if (kgMatch && last) {
    const sign = kgMatch[1] === '+' ? 1 : -1;
    const kg   = parseFloat(kgMatch[2]);
    const rec  = last.kg + (sign * kg);
    return { rec, basis: last.kg, week: last.week, instruction: targetLoad };
  }

  if (deload && !pctMatch && last) {
    const pct = Math.abs(parseFloat(deload[1])) / 100;
    const rec = Math.round((last.kg * (1 - pct)) * 2) / 2;
    return { rec, basis: last.kg, week: last.week, instruction: targetLoad };
  }

  if (matchWeek) {
    const targetWk = parseInt(matchWeek[1]);
    // Find what was logged in that specific week
    const w = WEEKS.find(x => x.week === targetWk);
    if (w && w.gym) {
      for (const gk of ['dayA','dayB','dayC']) {
        const gd = w.gym[gk];
        if (!gd || !gd.exercises) continue;
        const idx = gd.exercises.findIndex(e => e.name === exName);
        if (idx === -1) continue;
        const sk = 'ams_' + targetWk + '_' + gk + '_' + idx;
        const logged = syncGet(sk + '_kg');
        if (logged && logged.trim() !== '') {
          const kg = parseFloat(logged.replace(/[^0-9.]/g,''));
          if (!isNaN(kg)) return { rec: kg, basis: kg, week: targetWk, instruction: 'Match W' + targetWk };
        }
      }
    }
    // If nothing logged for that week, fall through
  }

  // 1RM percentage
  if (absolute) {
    // Can't compute without a 1RM — skip
    return null;
  }

  // "Heavy", "Maintain", "Light", "Moderate" — just show last logged as reference
  if ((tl.includes('heavy') || tl.includes('maintain') || tl.includes('light') || tl.includes('moderate')) && last) {
    return { rec: last.kg, basis: last.kg, week: last.week, instruction: targetLoad, isReference: true };
  }

  return null;
}

function DayDrawer({ w, day, onClose }) {
  const gymKey = GYM_MAP[day.day];
  const gymDay = gymKey && w.gym && w.gym[gymKey];
  // tick forces re-render when sync data arrives
  const [tick, setTick] = useState(0);
  const [vals, setVals] = useState({});

  React.useEffect(() => {
    // If data already loaded, seed vals from cache immediately
    if (_loaded) {
      setTick(t => t + 1);
      return;
    }
    // Otherwise subscribe and re-render when it arrives
    const fn = () => setTick(t => t + 1);
    onSyncStatus(fn);
    // Fallback poll — in case event already fired before we subscribed
    const poll = setInterval(() => {
      if (_loaded) { setTick(t => t + 1); clearInterval(poll); }
    }, 200);
    return () => clearInterval(poll);
  }, []);

  function getVal(sk, field) {
    const k = sk+"_"+field;
    // Local edits take priority over cache
    if (k in vals) return vals[k];
    return syncGet(k);
  }
  function setVal(sk, field, v) {
    const k = sk+"_"+field;
    setVals(prev => ({...prev, [k]: v}));
    syncSet(k, v);
  }

  return (
    <>
      <div style={s.backdrop} onClick={onClose} />
      <div style={s.drawer}>
        <div style={s.grip} />
        <div style={s.dTop}>
          <div>

            <div style={s.dTitleTxt}>{day.type==="RUN"?"🏃 ":"🏋️ "}{day.label}</div>

        <div style={s.dBody}>
          {day.type==="GYM" && w.phtNote && (
            <div style={s.dPht}><strong style={{color:"#ff6b35"}}>⚠ PHT:</strong> {w.phtNote}</div>

          {day.detail && <div style={s.dDetailBox}>{day.detail}</div>}
          {day.type === "RUN" && (() => {
            const sk = "run_"+w.week+"_"+day.day+"_"+day.label.replace(/[^a-z0-9]/gi,'_');
            return (
              <div style={s.dRunLog}>
                <div style={s.dSection}>Log This Run</div>
                <div style={s.dRunInputs}>
                  <div style={s.dRunField}>
                    <label style={s.dRunLbl}>Actual Time</label>
                    <input style={s.dRunInput} type="text" placeholder="e.g. 47:32"
                      value={getVal(sk,'time')} onChange={ev => setVal(sk,'time',ev.target.value)} />
                  </div>
                  <div style={s.dRunField}>
                    <label style={s.dRunLbl}>Actual Distance</label>
                    <input style={s.dRunInput} type="text" placeholder="e.g. 9.2 km"
                      value={getVal(sk,'dist')} onChange={ev => setVal(sk,'dist',ev.target.value)} />
                  </div>
                  <div style={s.dRunField}>
                    <label style={s.dRunLbl}>Avg Pace</label>
                    <input style={s.dRunInput} type="text" placeholder="e.g. 5:08/km"
                      value={getVal(sk,'pace')} onChange={ev => setVal(sk,'pace',ev.target.value)} />
                  </div>
                  <div style={s.dRunField}>
                    <label style={s.dRunLbl}>Avg HR</label>
                    <input style={s.dRunInput} type="text" placeholder="e.g. 143 bpm"
                      value={getVal(sk,'hr')} onChange={ev => setVal(sk,'hr',ev.target.value)} />
                  </div>
                </div>
                <div style={{marginTop:8}}>
                  <label style={s.dRunLbl}>Notes / Feel</label>
                  <input style={{...s.dRunInput2, width:"100%", marginTop:4}} type="text" placeholder="How did it feel? PHT? Energy?"
                    value={getVal(sk,'notes')} onChange={ev => setVal(sk,'notes',ev.target.value)} />
                </div>
              </div>
            );
          })()}
          {gymDay && gymDay.exercises && gymDay.exercises.length > 0 && (
            <>
              <div style={s.dSection}>Exercises</div>
              {gymDay.exercises.map((e, ei) => {
                const sk = "ams_"+w.week+"_"+gymKey+"_"+ei;
                return (
                  <div key={ei} style={s.dEx}>
                    <div style={s.dExName}>{e.name}</div>
                    <div style={s.dExMeta}>
                      <span><span style={s.dExMetaLbl}>Sets </span><span style={s.dExMetaVal}>{e.sets}</span></span>
                      <span><span style={s.dExMetaLbl}>Reps </span><span style={s.dExMetaVal}>{e.reps}</span></span>
                      <span><span style={s.dExMetaLbl}>Target </span><span style={s.dExMetaVal}>{e.load}</span></span>
                    </div>
                    {e.notes && <div style={s.dExNotes}>{e.notes}</div>}
                    {(() => {
                      const rec = calcRecommended(e.load, e.name, w.week, gymKey);
                      if (!rec) return null;
                      return (
                        <div style={s.dRec}>
                          <div>
                            <div style={s.dRecLbl}>{rec.isReference ? 'Last logged (reference)' : 'Recommended this session'}</div>
                            <div style={s.dRecSub}>Based on {rec.basis}kg in W{rec.week} · {rec.instruction}</div>
                          </div>
                          <div style={s.dRecVal}>{rec.rec}kg</div>

                    })()}

                );
              })}

// ── WEEKLY RUN SUMMARY ────────────────────────────────────────────────────────
function getWeekRunSummary(w) {
  const runs = w.days.filter(d => d.type === 'RUN');
  let totalMins = 0, totalKm = 0, logged = 0;
  runs.forEach(day => {
    const sk = 'run_'+w.week+'_'+day.day+'_'+day.label.replace(/[^a-z0-9]/gi,'_');
    const time = syncGet(sk+'_time');
    const dist = syncGet(sk+'_dist');
    if (time) {
      // Parse time — accepts mm:ss, hh:mm:ss, or plain minutes
      const parts = time.trim().split(':').map(Number);
      let mins = 0;
      if (parts.length === 3) mins = parts[0]*60 + parts[1] + parts[2]/60;
      else if (parts.length === 2) mins = parts[0] + parts[1]/60;
      else mins = parts[0];
      if (!isNaN(mins)) totalMins += mins;
      logged++;
    }
    if (dist) {
      const km = parseFloat(dist.replace(/[^0-9.]/g,''));
      if (!isNaN(km)) totalKm += km;
    }
  });
  return { totalMins, totalKm, logged, total: runs.length };
}

function formatMins(mins) {
  const h = Math.floor(mins / 60);
  const m = Math.round(mins % 60);
  if (h === 0) return m + 'm';
  return h + 'h ' + (m > 0 ? m + 'm' : '');
}

  const filters = [
    {k:"all",label:"All"},{k:"p1",label:"Phase 1"},{k:"p2",label:"Phase 2"},
    {k:"p3",label:"Phase 3"},{k:"taper",label:"Taper"},
  ];

  return (
    <div style={s.body}>
      <div style={s.hdr}>
        <h1 style={s.h1}>AMSTERDAM <em style={s.h1em}>PLAN</em></h1>
        <div style={s.sub}>Michael · Sub-3:00 · 5km 17:30 · PHT Rehab · 24 Weeks</div>
        <div style={s.metaRow}>
          {[["Start","5 May"],["Race","18 Oct"],["Weeks","24"]].map(([l,v])=>(
            <div key={l} style={s.metaItm}>
              <label style={s.metaLbl}>{l}</label>
              <span style={s.metaVal}>{v}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={s.phaseList}>
        {phases.map(p => {
          const ps = PHASE_STYLE[p.k];
          return (
            <div key={p.k} style={s.phaseRow}>
              <div style={{...s.phaseDot, background:ps.col}} />
              <div>
                <p style={{...s.phaseH, color:ps.col}}>{p.name}</p>
                <p style={s.phaseP}>{p.desc}</p>
                <span style={{...s.phaseBadge, color:ps.col, background:ps.bg, border:"1px solid "+ps.bd}}>{p.dates}</span>
              </div>
            </div>
          );
        })}
      </div>

      <div style={s.filterBar}>
        {filters.map(f => (
          <button key={f.k} style={{...s.fbtn, ...(filter===f.k?s.fbtnOn:{})}}
            onClick={() => setFilter(f.k)}>{f.label}</button>
        ))}
      </div>

      <div style={s.weekList}>
        {WEEKS.map(w => <WeekRow key={w.week} w={w} phaseFilter={filter} />)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
